<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b110f"/><stop offset="1" stop-color="#070b0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3ee9b0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#283a35"/>

  <text x="72" y="92" fill="#3ee9b0" font-size="13" letter-spacing="6">// A HANDS-ON FIELD GUIDE · ZERO DEPENDENCIES</text>

  <text x="68" y="210" fill="#e9f1ec" font-family="Georgia,serif" font-weight="bold" font-size="104" letter-spacing="-3">NEURALWORKS</text>
  <text x="72" y="262" fill="#7e938a" font-family="Georgia,serif" font-style="italic" font-size="30">how neural networks <tspan fill="#3ee9b0">actually</tspan> work — for engineers.</text>

  <!-- concept glyph strip -->
  <g transform="translate(72,320)" font-size="12" fill="#7e938a">
    <!-- neuron -->
    <g filter="url(#glow)">
      <circle cx="14" cy="26" r="6" fill="#3ee9b0"/><circle cx="14" cy="50" r="6" fill="#3ee9b0"/>
      <circle cx="64" cy="38" r="7" fill="#f6b14a"/>
      <line x1="20" y1="26" x2="58" y2="36" stroke="#283a35"/><line x1="20" y1="50" x2="58" y2="40" stroke="#283a35"/>
    </g>
    <text x="0" y="84">01 · MLP</text>

    <!-- gradient -->
    <g transform="translate(150,0)"><path d="M6 58 Q40 -4 74 58" fill="none" stroke="#3ee9b0" stroke-width="2"/><circle cx="20" cy="34" r="5" fill="#f6b14a"/></g>
    <text x="150" y="84">02 · BACKPROP</text>

    <!-- conv -->
    <g transform="translate(300,18)"><rect width="46" height="46" fill="none" stroke="#283a35"/><rect x="8" y="8" width="20" height="20" fill="none" stroke="#f6b14a" stroke-width="2"/><rect x="34" width="20" height="46" fill="#3ee9b0" fill-opacity="0.4"/></g>
    <text x="300" y="84">03 · CNN</text>

    <!-- graph -->
    <g transform="translate(450,16)" stroke="#283a35"><line x1="10" y1="34" x2="40" y2="8"/><line x1="40" y1="8" x2="60" y2="40"/><line x1="10" y1="34" x2="60" y2="40"/>
      <circle cx="10" cy="34" r="6" fill="#3ee9b0"/><circle cx="40" cy="8" r="6" fill="#f6b14a"/><circle cx="60" cy="40" r="6" fill="#1f7a5c"/></g>
    <text x="450" y="84">04 · GNN</text>

    <!-- attention -->
    <g transform="translate(600,18)"><rect width="14" height="14" fill="#3ee9b0"/><rect x="16" width="14" height="14" fill="#1f7a5c"/><rect x="32" width="14" height="14" fill="#3ee9b0" fill-opacity="0.5"/>
      <rect y="16" width="14" height="14" fill="#1f7a5c"/><rect x="16" y="16" width="14" height="14" fill="#f6b14a"/><rect x="32" y="16" width="14" height="14" fill="#1f7a5c"/>
      <rect y="32" width="14" height="14" fill="#3ee9b0" fill-opacity="0.5"/><rect x="16" y="32" width="14" height="14" fill="#1f7a5c"/><rect x="32" y="32" width="14" height="14" fill="#3ee9b0"/></g>
    <text x="600" y="84">05 · ATTENTION</text>

    <!-- rag -->
    <g transform="translate(760,20)" stroke="#3ee9b0" fill="none" stroke-width="2"><circle cx="12" cy="22" r="9"/><line x1="20" y1="30" x2="34" y2="44"/><rect x="40" y="6" width="34" height="34" stroke="#f6b14a"/></g>
    <text x="760" y="84">06 · RAG</text>
  </g>

  <text x="1208" y="412" text-anchor="end" fill="#566860" font-size="11">vanilla JS · Canvas · SVG · no build step</text>
</svg>
